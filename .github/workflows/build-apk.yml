
name: Build Aaraaf Tractor Khata APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept SDK licenses and install required packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Extract source ZIP and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*logo-updated-source*.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi
          if [[ -z "$ZIP_FILE" ]]; then
            echo "No source ZIP found in repository root." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/aaraaf-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaraaf-source"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/aaraaf-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "Could not find Gradle settings file inside ZIP." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" || ! -f "$PROJECT_DIR/gradlew" ]]; then
            echo "Android app module or Gradle wrapper not found." >&2
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaraaf-Tractor-Khata-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
