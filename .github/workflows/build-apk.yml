
name: Build Aaraaf Tractor Khata APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Extract source ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*logo-updated-source*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi

          if [[ -z "$ZIP_FILE" ]]; then
            echo "Source ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/aaraaf-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaraaf-source"

          PROJECT_DIR="$RUNNER_TEMP/aaraaf-source/native_work"

          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "Gradle settings not found"
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "Android app module not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          if [[ ! -f "$PROJECT_DIR/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$PROJECT_DIR/debug.keystore"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "${{ steps.project.outputs.project_dir }}" --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaraaf-Tractor-Khata-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
