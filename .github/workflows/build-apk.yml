name: Build Aaraaf Tractor Khata APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "platforms;android-36.1" "platform-tools" "build-tools;36.0.0"

      - name: Extract source ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*logo-updated-source*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi

          if [[ -z "$ZIP_FILE" ]]; then
            echo "Source ZIP not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/aaraaf-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaraaf-source"

          PROJECT_FILE="$(find "$RUNNER_TEMP/aaraaf-source" -type f -path '*/app/build.gradle.kts' -print -quit)"

          if [[ -z "$PROJECT_FILE" ]]; then
            echo "Android project not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"

          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "Gradle settings file not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaraaf-Tractor-Khata-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
